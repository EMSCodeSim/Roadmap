name: firepath
description: "Responder Roadmap — career task books, credential tracking, professional growth, and long-term career records for fire and EMS professionals."
publish_to: "none"

version: 1.2.0+21

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.32.0"

dependencies:
  url_launcher: ^6.3.0
  shared_preferences: ^2.3.2
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  file_picker: ^8.3.7
  pdf: ^3.11.3
  printing: ^5.14.3
  http: ^1.2.2
  flutter_secure_storage: ^9.2.4
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  go_router: ^14.6.2
  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/icons/Roadmap.png
    - assets/icons/career_road_icon_v2.png
    - assets/graphics/career_road_banner.jpg
    - assets/graphics/career_road_banner_v2.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path_android: assets/icons/Roadmap.png
  image_path_ios: assets/icons/Roadmap.png
  remove_alpha_ios: true
  web:
    generate: true
    image_path: assets/icons/Roadmap.png
    background_color: "#071A33"
    theme_color: "#071A33"
