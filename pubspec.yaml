name: firepath
description: "Fire Career Roadmap — career task books, credential tracking, professional growth, and long-term career records for fire and EMS professionals."
publish_to: "none"

version: 1.1.0+3

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.32.0"

dependencies:
  url_launcher: ^6.0.0
  shared_preferences: ^2.0.0
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^8.2.0
  go_router: ^16.2.0
  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/icons/career_road_icon.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icons/career_road_icon.png
  remove_alpha_ios: true
  web:
    generate: true
    image_path: assets/icons/career_road_icon.png
    background_color: "#071A33"
    theme_color: "#071A33"