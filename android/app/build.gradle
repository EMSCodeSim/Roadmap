plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.fireopssim.careerroadmap"
    // Keep these aligned with the Flutter toolchain values so Dreamflow can
    // recognize this as a standard template while still targeting API 36.
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId "com.fireopssim.careerroadmap"
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            // In Dreamflow, signing is handled by the deployment pipeline.
            // Keep the Android module aligned with the standard Flutter template.
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}
