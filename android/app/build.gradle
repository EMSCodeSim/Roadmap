plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.fireopssim.careerroadmap"

    // Keep SDK values aligned with the Flutter/Dreamflow template.
    // Dreamflow's Android inspection reads the effective values from Flutter's toolchain.
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        // Kotlin expects a String here; also matches the standard Flutter template.
        jvmTarget = '17'
    }

    defaultConfig {
        applicationId "com.fireopssim.careerroadmap"
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            // Dreamflow can replace/sign the release artifact in its deployment pipeline.
            // This fallback keeps a normal Flutter appbundle build from failing when
            // a local Play upload keystore is not present.
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}
