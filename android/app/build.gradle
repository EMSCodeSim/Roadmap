plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.fireopssim.careerroadmap"

    // Android 16 / Google Play requirement.
    // Pin explicitly so the build does not depend on Dreamflow's Flutter defaults.
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId "com.fireopssim.careerroadmap"
        minSdk = flutter.minSdkVersion
        targetSdk = 36
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            // Dreamflow can replace/sign the release artifact in its deployment pipeline.
            // This fallback keeps a normal Flutter appbundle build from failing when
            // a local Play upload keystore is not present.
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}
