name: Apply long-term career tools

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-longevity-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Apply integration
        run: python tools/apply_longevity_tools.py
      - name: Format changed Dart files
        run: dart format lib/nav.dart lib/pages/career/career_intelligence_page.dart lib/pages/career/career_longevity_page.dart lib/services/career_longevity.dart
      - name: Analyze long-term tools
        run: |
          flutter pub get
          flutter analyze --no-fatal-warnings --no-fatal-infos
      - name: Commit long-term career tools
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/nav.dart lib/pages/career/career_intelligence_page.dart lib/pages/career/career_longevity_page.dart lib/services/career_longevity.dart
          git commit -m 'Add long-term career intelligence tools'
          git push
