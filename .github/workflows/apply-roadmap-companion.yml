name: Apply Roadmap companion integration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-roadmap-companion.yml'
      - 'tools/apply_roadmap_companion_update.py'

permissions:
  contents: write

jobs:
  apply-companion:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Apply companion integration
        run: python3 tools/apply_roadmap_companion_update.py

      - name: Format changed Dart files
        run: dart format lib/pages/task_book/task_detail_page.dart lib/services/task_book_library.dart

      - name: Commit companion integration
        run: |
          if git diff --quiet; then
            echo "No companion changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/pages/task_book/task_detail_page.dart lib/services/task_book_library.dart
          git commit -m "Connect Task Books to FireOpsSim companion resources"
          git push origin main
