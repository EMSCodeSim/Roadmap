name: Fix Task Book practice links

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-practice-links:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Apply practice link fix
        run: python3 tools/fix_taskbook_practice_links.py

      - name: Format changed Dart file
        run: dart format lib/pages/task_book/task_detail_page.dart

      - name: Commit practice link fix
        run: |
          if git diff --quiet; then
            echo "No practice link changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/pages/task_book/task_detail_page.dart
          git commit -m "Open Task Book practice tools in FireOpsSim"
          git push origin main
