name: Fix top three roadmap needs

on:
  push:
    branches:
      - agent/fix-top-three-needs

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-top-three-needs
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply fixes
        run: python .github/scripts/fix_top_three.py

      - name: Validate fixes
        run: |
          flutter pub get
          dart format lib/pages/shell/app_shell_page.dart lib/state/app_state.dart lib/services/career_record_store.dart lib/pages/career/personal_log_page.dart test/top_three_fixes_test.dart
          flutter analyze --no-fatal-warnings --no-fatal-infos
          flutter test

      - name: Commit fixes
        run: |
          rm -f .github/workflows/fix-top-three-needs.yml .github/scripts/fix_top_three.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Fix navigation custom goals and portfolio backup"
            git push origin HEAD:agent/fix-top-three-needs
          fi
