name: Flutter validation

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Check out the authoritative backend contract
        uses: actions/checkout@v6
        with:
          repository: EMSCodeSim/ResponderRoadmap
          ref: ${{ github.head_ref == 'feat/ten-member-training-sheet-mobile-closeout-20261023' && 'feat/ten-member-training-sheet-acceptance-20261023' || 'main' }}
          path: backend-contract

      - name: Set up Node for backend contract verification
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify the supported backend API contract
        run: node backend-contract/scripts/check-mobile-api-contract.mjs .

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze (warnings fail CI)
        run: flutter analyze --no-fatal-infos

      - name: Core career loop regression tests
        run: flutter test test/core_career_loop_regression_test.dart

      - name: ResponderRoadmap department flow tests
        run: flutter test test/responder_roadmap_department_flow_test.dart

      - name: Ten-member offline Training Sheet synchronization tests
        run: flutter test test/training_sheet_offline_sync_test.dart

      - name: Shared competency and evidence tests
        run: flutter test test/competency_evidence_bridge_test.dart

      - name: Department Skill Mastery parsing tests
        run: flutter test test/department_skill_mastery_test.dart

      - name: Career Coach evidence suggestion tests
        run: flutter test test/career_coach_test.dart

      - name: Competency Map freshness tests
        run: flutter test test/competency_map_test.dart

      - name: Task Book focus preference tests
        run: flutter test test/task_book_focus_store_test.dart

      - name: Verify personal qualification task book navigation
        run: |
          grep -q "1. Find a class" lib/pages/task_book/qualification_task_book_page.dart
          grep -q "2. Books and chapters" lib/pages/task_book/qualification_task_book_page.dart
          grep -q "3. Skills and JPRs" lib/pages/task_book/qualification_task_book_page.dart
          grep -q "4. Written test" lib/pages/task_book/qualification_task_book_page.dart
          grep -q "5. Skills test" lib/pages/task_book/qualification_task_book_page.dart
          grep -q "authority.sourceUrl" lib/pages/task_book/qualification_task_book_page.dart

  platform-builds:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build web release
        run: flutter build web --release

      - name: Build Android APK release
        run: flutter build apk --release

      - name: Build Android App Bundle release
        run: flutter build appbundle --release

  full-test-suite:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run full legacy test suite (diagnostic)
        id: legacy_tests
        timeout-minutes: 15
        continue-on-error: true
        run: flutter test --timeout 2m

      - name: Report legacy diagnostic failures
        if: steps.legacy_tests.outcome == 'failure'
        run: echo "::warning::One or more legacy diagnostic tests failed or timed out. Required regression tests and platform builds remain authoritative."

  ios-release:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS release without signing
        run: flutter build ios --release --no-codesign
