name: Clean top three lockfile noise

on:
  push:
    branches:
      - agent/fix-top-three-needs

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-top-three-needs
          fetch-depth: 0
      - name: Restore unchanged dependency lockfile
        run: |
          git fetch origin main
          git checkout origin/main -- pubspec.lock
          rm -f .github/workflows/cleanup-top-three-lock.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove generated lockfile noise"
          git push origin HEAD:agent/fix-top-three-needs
