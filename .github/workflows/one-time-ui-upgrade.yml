name: One-time UI upgrade

on:
  push:
    branches:
      - agent/full-ui-log-upgrade

permissions:
  contents: write

jobs:
  upgrade:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/full-ui-log-upgrade
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          python -m pip install --upgrade pillow

      - name: Build clean icon and graphics
        run: |
          rsvg-convert -w 1024 -h 1024 assets/icons/career_road_icon.svg > assets/icons/career_road_icon.png
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          from pathlib import Path

          root = Path('.')
          icon = Image.open(root/'assets/icons/career_road_icon.png').convert('RGBA')
          bold = '/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf'
          regular = '/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf'

          def font(path, size):
              return ImageFont.truetype(path, size)

          def banner(path, title, subtitle, square=False):
              size = (1024, 1024) if square else (1600, 900)
              im = Image.new('RGB', size, '#071a33')
              d = ImageDraw.Draw(im)
              w, h = size
              d.rounded_rectangle((24,24,w-24,h-24), radius=54, outline='#274c77', width=4, fill='#071a33')
              icon_size = 360 if square else 430
              mark = icon.resize((icon_size, icon_size), Image.Resampling.LANCZOS)
              if square:
                  im.paste(mark, ((w-icon_size)//2, 430), mark)
                  d.text((w//2, 92), title, font=font(bold, 66), fill='white', anchor='ma')
                  d.text((w//2, 182), subtitle, font=font(regular, 31), fill='#c8d5e5', anchor='ma')
              else:
                  im.paste(mark, (w-icon_size-90, (h-icon_size)//2), mark)
                  d.text((82, 185), title, font=font(bold, 82), fill='white')
                  d.text((84, 300), subtitle, font=font(regular, 38), fill='#c8d5e5')
                  d.rounded_rectangle((84, 410, 700, 525), radius=30, fill='#0d3158')
                  d.text((118, 445), 'Learn  •  Train  •  Certify  •  Lead  •  Advance', font=font(bold, 26), fill='#f4c65a')
              im.save(path, 'JPEG', quality=88, optimize=True)

          banner(root/'assets/graphics/professional_growth_roadmap_banner.jpg', 'Professional Growth', 'Track your path. Build your future.')
          banner(root/'assets/graphics/career_vault.jpg', 'Detailed Evidence', 'Save the examples your future self will need.', square=True)
          banner(root/'assets/graphics/advancement_dashboard.jpg', 'Advancement', 'Readiness, gaps, and your best next move.', square=True)
          banner(root/'assets/graphics/promotion_story_bank.jpg', 'Story Bank', 'Leadership examples ready for future interviews.', square=True)
          PY

      - name: Apply UI and platform cleanup
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, plistlib, re

          shell = Path('lib/pages/shell/app_shell_page.dart')
          shell.write_text("""import 'package:flutter/material.dart';
          import 'package:go_router/go_router.dart';

          class AppShellPage extends StatelessWidget {
            final StatefulNavigationShell navigationShell;

            const AppShellPage({super.key, required this.navigationShell});

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                body: navigationShell,
                bottomNavigationBar: NavigationBar(
                  selectedIndex: navigationShell.currentIndex,
                  onDestinationSelected: (index) => navigationShell.goBranch(
                    index,
                    initialLocation: index == navigationShell.currentIndex,
                  ),
                  destinations: const [
                    NavigationDestination(icon: Icon(Icons.home_outlined), selectedIcon: Icon(Icons.home), label: 'Home'),
                    NavigationDestination(icon: Icon(Icons.route_outlined), selectedIcon: Icon(Icons.route), label: 'Path'),
                    NavigationDestination(icon: Icon(Icons.add_task_outlined), selectedIcon: Icon(Icons.add_task), label: 'Log'),
                    NavigationDestination(icon: Icon(Icons.trending_up_outlined), selectedIcon: Icon(Icons.trending_up), label: 'Growth'),
                    NavigationDestination(icon: Icon(Icons.verified_outlined), selectedIcon: Icon(Icons.verified), label: 'Certs'),
                  ],
                ),
              );
            }
          }
          """)

          # Remove temporary shell helper now that the actual shell is replaced.
          Path('lib/pages/shell/app_shell_v2_page.dart').unlink(missing_ok=True)

          # Make naming consistent with the new two-speed log/evidence model.
          hub = Path('lib/pages/career/career_hub_page.dart')
          if hub.exists():
              text = hub.read_text()
              text = text.replace("tooltip: 'Career Vault'", "tooltip: 'Personal Log'")
              text = text.replace("label: 'Career Vault'", "label: 'Personal Log'")
              text = text.replace("const Text('Career Vault')", "const Text('Personal Log')")
              hub.write_text(text)

          vault = Path('lib/pages/career/career_vault_page.dart')
          if vault.exists():
              text = vault.read_text().replace("title: const Text('Career Vault')", "title: const Text('Detailed Evidence')")
              vault.write_text(text)

          # Correct Android branding and namespace.
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          if manifest.exists():
              text = manifest.read_text()
              text = re.sub(r'android:label="[^"]*"', 'android:label="FireOps Career Road"', text, count=1)
              manifest.write_text(text)

          for gradle_name in ['android/app/build.gradle.kts', 'android/app/build.gradle']:
              gradle = Path(gradle_name)
              if gradle.exists():
                  text = gradle.read_text()
                  text = re.sub(r'namespace\s*=\s*["\'][^"\']+["\']', 'namespace = "com.fireopssim.careerroadmap"', text, count=1)
                  gradle.write_text(text)

          # Correct iOS display naming without disturbing bundle identifiers/signing.
          plist_path = Path('ios/Runner/Info.plist')
          if plist_path.exists():
              with plist_path.open('rb') as f:
                  plist = plistlib.load(f)
              plist['CFBundleDisplayName'] = 'FireOps Career Road'
              plist['CFBundleName'] = 'FireOpsCareerRoad'
              with plist_path.open('wb') as f:
                  plistlib.dump(plist, f, sort_keys=False)

          # Correct web app identity.
          web_manifest = Path('web/manifest.json')
          if web_manifest.exists():
              data = json.loads(web_manifest.read_text())
              data['name'] = 'FireOps Career Road'
              data['short_name'] = 'Career Road'
              data['description'] = 'Professional growth, career roadmap, certifications, and personal activity tracking for fire and EMS professionals.'
              data['theme_color'] = '#071a33'
              data['background_color'] = '#071a33'
              web_manifest.write_text(json.dumps(data, indent=2) + '\n')

          index = Path('web/index.html')
          if index.exists():
              text = index.read_text()
              text = re.sub(r'<title>.*?</title>', '<title>FireOps Career Road</title>', text, flags=re.S)
              text = re.sub(r'<meta name="apple-mobile-web-app-title" content="[^"]*">', '<meta name="apple-mobile-web-app-title" content="FireOps Career Road">', text)
              index.write_text(text)

          # Point launcher generation at the repaired PNG and generate web icons too.
          pubspec = Path('pubspec.yaml')
          text = pubspec.read_text().replace('assets/icons/career_road_icon.jpg', 'assets/icons/career_road_icon.png')
          if '  web:\n    generate:' not in text:
              marker = '  remove_alpha_ios: true'
              text = text.replace(marker, marker + '\n  web:\n    generate: true\n    image_path: assets/icons/career_road_icon.png\n    background_color: "#071a33"\n    theme_color: "#071a33"')
          pubspec.write_text(text)
          PY

      - name: Generate native launcher icons
        run: |
          flutter pub get
          dart run flutter_launcher_icons

      - name: Validate generated project
        run: |
          flutter analyze
          flutter test

      - name: Commit generated cleanup
        run: |
          rm -f .github/workflows/one-time-ui-upgrade.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Finish UI, branding, and launcher asset cleanup"
            git push origin HEAD:agent/full-ui-log-upgrade
          fi
