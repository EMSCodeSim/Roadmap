name: Apply export and transfer integration

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-export-transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Apply integration
        run: python3 tools/apply_export_transfer_integration.py
      - name: Install dependencies
        run: flutter pub get
      - name: Format changed Dart files
        run: dart format lib/nav.dart lib/pages/career/career_intelligence_page.dart lib/pages/career/career_export_page.dart lib/pages/career/department_transfer_page.dart lib/services/career_pdf_export.dart lib/services/department_transfer_service.dart lib/models/department_transfer.dart
      - name: Analyze export and transfer tools
        run: flutter analyze lib/nav.dart lib/pages/career/career_intelligence_page.dart lib/pages/career/career_export_page.dart lib/pages/career/department_transfer_page.dart lib/services/career_pdf_export.dart lib/services/department_transfer_service.dart lib/models/department_transfer.dart
      - name: Commit export and transfer tools
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/nav.dart lib/pages/career/career_intelligence_page.dart lib/pages/career/career_export_page.dart lib/pages/career/department_transfer_page.dart lib/services/career_pdf_export.dart lib/services/department_transfer_service.dart lib/models/department_transfer.dart pubspec.lock
          git commit -m "Add PDF career exports and department transfer intelligence"
          git push origin main
